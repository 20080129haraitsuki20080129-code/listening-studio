# Runs the checks that do not need a GPU, a model download or a browser.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: listening
          POSTGRES_PASSWORD: listening
          POSTGRES_DB: listening_studio
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U listening"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system audio tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg espeak-ng

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.in

      - name: Lint
        working-directory: backend
        run: ruff check app/ tests/

      - name: Test
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://listening:listening@localhost:5432/listening_studio
        # Tests use a stub speech provider, so no model is ever downloaded.
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Types and lint
        working-directory: frontend
        run: |
          npx tsc --noEmit
          npx eslint .

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
        run: npm run build
