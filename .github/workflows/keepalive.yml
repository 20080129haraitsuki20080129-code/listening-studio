# Keeps the free tiers from going to sleep.
#
# A free Supabase project pauses after 7 days without traffic and has to be
# resumed by hand; a free Hugging Face Space sleeps after 48 hours idle. One
# request to /health touches both, since the health check opens a database
# connection.
#
# GitHub Actions is free for this: a few seconds a day, well inside the free
# minutes even on a private repository.
#
# Note GitHub disables scheduled workflows in a repository with no activity
# for 60 days. If this repo goes quiet, either push something or move the ping
# to an external uptime service.

name: Keep alive

on:
  schedule:
    # Twice a day. Enough to stay well inside both timeouts without hammering
    # somebody else's free tier.
    - cron: "0 3,15 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the API
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          if [ -z "$API_BASE_URL" ]; then
            echo "API_BASE_URL secret is not set; nothing to ping."
            exit 0
          fi

          # A cold Space takes a while to wake, so allow for the start-up.
          for attempt in 1 2 3 4 5; do
            code=$(curl -s -o /tmp/body -w "%{http_code}" --max-time 120 \
              "$API_BASE_URL/health" || echo "000")
            if [ "$code" = "200" ]; then
              echo "healthy on attempt $attempt: $(cat /tmp/body)"
              exit 0
            fi
            echo "attempt $attempt: HTTP $code"
            sleep 30
          done

          echo "API did not come up." >&2
          exit 1
