# Optional: run PostgreSQL in a container instead of installing it locally.
# The project was developed against a Homebrew PostgreSQL 16, and either works
# -- the connection string is the same.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: listening
      POSTGRES_PASSWORD: listening
      POSTGRES_DB: listening_studio
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listening -d listening_studio"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
